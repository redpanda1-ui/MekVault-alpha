name: MekVault CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build server
        run: npm run build --workspace server

      - name: Bundle Android JavaScript
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://mekvault-alpha.onrender.com
        run: npx expo export --platform android --output-dir /tmp/mekvault-ci
